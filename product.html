<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Product — Ankara Palace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
  <a href="#main" class="visually-hidden">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container" id="product-root">
      <!-- Populated by product.js -->
      <div class="empty-state">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p>Loading fabric…</p>
      </div>
    </div>

    <section class="related-section" id="related-section" hidden>
      <div class="container">
        <div class="section-head section-head--left" style="flex-direction:row; justify-content:space-between; text-align:left; align-items:flex-end;">
          <div>
            <span class="section-head__eyebrow">You May Also Like</span>
            <h2 class="section-head__title">Related Fabrics</h2>
          </div>
          <a href="shop.html" class="btn btn--outline btn--sm">View All</a>
        </div>
        <div class="product-grid" id="related-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="nav.js"></script>
  <script src="main.js"></script>
  <script src="live.js"></script>
