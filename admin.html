<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Ankara Palace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body data-requires-admin>
  <button type="button" class="admin-menu-toggle" id="admin-menu-toggle" aria-label="Toggle navigation">
    <i class="fa-solid fa-bars"></i>
  </button>
  <div class="admin-side-overlay" id="admin-side-overlay"></div>

  <div class="admin-shell">
    <aside class="admin-side" id="admin-side">
      <div class="admin-side__brand">
        <span class="logo__mark">AP</span>
        <div>
          <h1>Ankara Palace</h1>
          <small>Admin Console</small>
        </div>
      </div>

      <nav class="admin-nav" id="admin-nav" aria-label="Admin sections"></nav>

      <div class="admin-side__footer">
        <button type="button" id="admin-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 id="admin-title">Overview</h1>
          <p id="admin-subtitle">Business performance at a glance.</p>
        </div>
        <div class="admin-topbar__actions" id="admin-topbar-actions"></div>
      </div>

      <div id="admin-content"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="charts.js"></script>
  <script src="main.js"></script>
  <script src="admin.js"></script>
  <script src="all.js"></script>
</body>
</html>
