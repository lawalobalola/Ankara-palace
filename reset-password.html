<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a New Password — Ankara Palace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to main content</a>
  <header id="site-header"></header>
  <main id="main"><div class="auth-shell">
    <aside class="auth-aside"><div class="auth-aside__inner"><div class="auth-aside__eyebrow">Account Recovery · Step 3</div><h2>Choose a new password</h2><p>Your reset code is verified. Set a new password for your account.</p></div></aside>
    <section class="auth-main"><div class="auth-card">
      <div class="auth-card__head"><h1>Reset Password</h1><p>Code sent to <strong id="reset-password-email"></strong></p></div>
      <div id="reset-alert" aria-live="polite"></div>
      <form id="reset-password-form" novalidate>
        <div class="form-group"><label for="rp-password" class="form-label">New Password <span class="req">*</span></label><input type="password" id="rp-password" class="form-control" autocomplete="new-password" required /><div class="form-error"></div></div>
        <div class="form-group"><label for="rp-confirm" class="form-label">Confirm New Password <span class="req">*</span></label><input type="password" id="rp-confirm" class="form-control" autocomplete="new-password" required /><div class="form-error"></div></div>
        <button type="submit" class="btn btn--primary btn--lg w-full"><i class="fa-solid fa-key"></i> Save New Password</button>
      </form>
      <div class="auth-note">Password updated? <a href="login.html" class="auth-link">Back to sign in</a></div>
    </div></section>
  </div></main>
  <footer id="site-footer"></footer>
  <script src="data.js"></script><script src="ui.js"></script><script src="nav.js"></script><script src="main.js"></script><script src="auth.js"></script>
</body>
</html>
