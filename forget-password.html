<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Ankara Palace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to main content</a>
  <header id="site-header"></header>
  <main id="main">
    <div class="auth-shell">
      <aside class="auth-aside"><div class="auth-aside__inner">
        <div class="auth-aside__eyebrow">Account Recovery · Step 1</div>
        <h2>Request a reset code</h2>
        <p>Enter the email address on your Ankara Palace account. We’ll email you a code to continue.</p>
      </div></aside>
      <section class="auth-main"><div class="auth-card">
        <div class="auth-card__head"><h1>Forgot Password?</h1><p>Remember your password? <a href="login.html" class="auth-link">Sign in</a></p></div>
        <div id="forgot-alert" aria-live="polite"></div>
        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="fp-email" class="form-label">Email Address <span class="req">*</span></label>
            <input type="email" id="fp-email" class="form-control" autocomplete="email" required />
            <div class="form-error"></div>
          </div>
          <button type="submit" class="btn btn--primary btn--lg w-full"><i class="fa-solid fa-paper-plane"></i> Send Reset Code</button>
        </form>
        <div class="auth-note">We’ll take you to the next page to enter your code and choose a new password.</div>
      </div></section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="data.js"></script><script src="ui.js"></script><script src="nav.js"></script><script src="main.js"></script><script src="auth.js"></script>
</body>
</html>
